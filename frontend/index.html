<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rezolotion Harness — Studio</title>
    <!-- Prevent Theme Flash (Zero FOUC) -->
    <script>
      (function() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const urlTheme = urlParams.get('theme');
          const storedTheme = localStorage.getItem('rezolotion-theme');
          const theme = urlTheme || storedTheme || 'dark';
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- Fonts are bundled locally via @fontsource; see src/styles/globals.css -->
  </head>
  <body class="bg-base text-fg antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
